name: "CodeQL"

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '37 10 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # JavaScript and TypeScript are analyzed together under this language id.
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # No Autobuild step: JavaScript/TypeScript is not a compiled language and
      # CodeQL extracts it without a build.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
